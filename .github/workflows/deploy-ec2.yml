name: Deploy backend to EC2 (manual)

# Disparo manual, nunca automático — evita gastos/cambios en el ambiente demo sin querer.
# Requiere secrets EC2_HOST, EC2_SSH_KEY, EC2_USER configurados en el repo (ver infra/README.md).
# Hasta que esos secrets existan, este workflow solo se puede lanzar a mano y fallará
# de forma segura (no hay credenciales que exponer).
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy vía SSH (docker-compose up en el EC2 del ambiente demo)
        run: |
          echo "TODO (T-05, infra/README.md): scp del build + docker-compose up en el EC2."
          echo "Requiere EC2_HOST/EC2_USER/EC2_SSH_KEY como secrets del repo."
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
