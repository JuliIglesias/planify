version: "3.9"

# Réplica local del ambiente de AWS (EC2 + RDS) — ver docs/01-plan-de-ejecucion.md §2
# y docs/02-decisiones.md (Duda #8 revisada). Docker no está instalado en esta máquina
# de desarrollo, así que este archivo no se pudo probar acá — revisar con
# `docker compose -f infra/docker-compose.yml up` apenas se tenga Docker disponible.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: planify
      POSTGRES_PASSWORD: planify
      POSTGRES_DB: planify
    ports:
      - "5432:5432"
    volumes:
      - planify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planify"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://planify:planify@postgres:5432/planify?schema=public
      PORT: 3000
      NODE_ENV: development
      JWT_SECRET: dev-secret-change-me
    ports:
      - "3000:3000"

volumes:
  planify_postgres_data:
